server:
  port: 8084

spring:
  application:
    name: estoque-pdv-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5436}/${DB_NAME:pdv}}
    username: ${DB_USER:pdv}
    password: ${DB_PASSWORD:pdv}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
  data:
    web:
      pageable:
        max-page-size: 100

app:
  jwt:
    # troque em producao (minimo 32 caracteres)
    secret: ${JWT_SECRET:dev-secret-troque-em-producao-0123456789}
    expiration-minutes: 480
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  seed:
    # usuarios criados na primeira execucao (so se a tabela estiver vazia)
    admin-password: ${ADMIN_PASSWORD:admin123}
    seller-password: ${SELLER_PASSWORD:vendedor123}

management:
  endpoints:
    web:
      exposure:
        include: health,info
